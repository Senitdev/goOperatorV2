  kind: ClusterRole
  name: gooperatorv2-manager-role
subjects:
- kind: ServiceAccount
  name: gooperatorv2-controller-manager
  namespace: gooperatorv2-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gooperatorv2-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gooperatorv2-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: gooperatorv2-controller-manager
  namespace: gooperatorv2-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
    control-plane: controller-manager
  name: gooperatorv2-controller-manager-metrics-service
  namespace: gooperatorv2-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: gooperatorv2
    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
  name: gooperatorv2-webhook-service
  namespace: gooperatorv2-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: gooperatorv2
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
    control-plane: controller-manager
  name: gooperatorv2-controller-manager
  namespace: gooperatorv2-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gooperatorv2
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: gooperatorv2
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        - --webhook-port=9443
        command:
        - /manager
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gooperatorv2-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
  name: gooperatorv2-metrics-certs
  namespace: gooperatorv2-system
spec:
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: gooperatorv2-selfsigned-issuer
  secretName: metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
  name: gooperatorv2-serving-cert
  namespace: gooperatorv2-system
spec:
  dnsNames:
  - gooperatorv2-webhook-service.gooperatorv2-system.svc
  - gooperatorv2-webhook-service.gooperatorv2-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: gooperatorv2-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
  name: gooperatorv2-selfsigned-issuer
  namespace: gooperatorv2-system
spec:
  selfSigned: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gooperatorv2
    control-plane: controller-manager
  name: gooperatorv2-controller-manager-metrics-monitor
  namespace: gooperatorv2-system
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: gooperatorv2
      control-plane: controller-manager
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: gooperatorv2-system/gooperatorv2-serving-cert
  name: gooperatorv2-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: gooperatorv2-webhook-service
      namespace: gooperatorv2-system
      path: /mutate-moncrds-senitdev-com-v2beta2-gobackend
  failurePolicy: Fail
  name: mgobackend-v2beta2.kb.io
  rules:
  - apiGroups:
    - moncrds.senitdev.com
    apiVersions:
    - v2beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - gobackends
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: gooperatorv2-system/gooperatorv2-serving-cert
  name: gooperatorv2-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: gooperatorv2-webhook-service
      namespace: gooperatorv2-system
      path: /validate-moncrds-senitdev-com-v2beta2-gobackend
  failurePolicy: Fail
  name: vgobackend-v2beta2.kb.io
  rules:
  - apiGroups:
    - moncrds.senitdev.com
    apiVersions:
    - v2beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - gobackends
  sideEffects: None
