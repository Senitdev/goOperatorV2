apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "gooperatorv2.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - moncrds.senitdev.com
  resources:
  - goapis
  - gobackends
  - gofrontends
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - moncrds.senitdev.com
  resources:
  - gobackends/status
  - gofrontends/status
  - gobackends/finalizers
  - gofrontends/finalizers
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - services
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - moncrds.senitdev.com
  resources:
  - goapis/finalizers
  verbs:
  - update
- apiGroups:
  - moncrds.senitdev.com
  resources:
  - goapis/status
  verbs:
  - get
  - patch
  - update
