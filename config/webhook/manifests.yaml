---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-moncrds-senitdev-com-v2beta2-gobackend
  failurePolicy: Fail
  name: mgobackend-v2beta2.kb.io
  rules:
  - apiGroups:
    - moncrds.senitdev.com
    apiVersions:
    - v2beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - gobackends
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-moncrds-senitdev-com-v2beta2-gobackend
  failurePolicy: Fail
  name: vgobackend-v2beta2.kb.io
  rules:
  - apiGroups:
    - moncrds.senitdev.com
    apiVersions:
    - v2beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - gobackends
  sideEffects: None
