apiVersion: moncrds.senitdev.com/v2beta2
kind: GoBackend
metadata:
  name: backend-demo
  namespace: default
spec:
  # Votre image backend compilée sous Alpine
  image: my-rag-backend-backend:latest
  port: 8080
  replicas: 2
  databaseRef:
    name: rag-database-rag  # doit correspondre exactement au metadata.name du Secret
    key: DATABASE_URL
  # Connexion à l'Ollama installé nativement sur votre Windows
  ollamaUrl: http://host.docker.internal:11434
  embeddingModel: nomic-embed-text
  llmModel: qwen2.5:1.5b
  # Autorise votre frontend Next.js à consommer l'API sans blocage CORS
  allowedOrigin: "*" 
  #storage
  storage:
    size: 3Gi
    accessMode: ReadWriteOnce
    #storageClassName: hostpath
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 50
